<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='8' y='8' font-size='17' text-anchor='middle' dominant-baseline='central' fill='%233B4EFF'>✦</text></svg>" />
    <title>Jay Li Quek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── ZT Bros Oskon 90s (bundled) — display face for the name & project titles ── */
        @font-face {
            font-family: 'ZT Bros Oskon 90s';
            src: url('./fonts/ZTBrosOskon90s-ExtraLight.otf') format('opentype');
            font-weight: 200; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'ZT Bros Oskon 90s';
            src: url('./fonts/ZTBrosOskon90s-Light.otf') format('opentype');
            font-weight: 300; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'ZT Bros Oskon 90s';
            src: url('./fonts/ZTBrosOskon90s-Italic.otf') format('opentype');
            font-weight: 400; font-style: italic; font-display: swap;
        }
        @font-face {
            font-family: 'ZT Bros Oskon 90s';
            src: url('./fonts/ZTBrosOskon90s-LightItalic.otf') format('opentype');
            font-weight: 300; font-style: italic; font-display: swap;
        }

        :root {
            --bg: #EDEBE3;
            --text: #1a1a1a;
            --muted: rgba(26, 26, 26, 0.60);
            --blue: #3B4EFF;
            --thumb-bg: #E4E2D9;   /* light backing behind mockup thumbnails */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Geist', sans-serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .page {
            max-width: 1936px;   /* two 868px thumbnails + 40px gutter + 80px side padding */
            margin: 0 auto;
            padding: 44px 80px 120px;
        }

        /* ── Header: name left, nav right ── */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
        }
        .brand {
            font-family: 'ZT Bros Oskon 90s', serif;
            font-weight: 300;
            font-size: 34px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--text);
            text-decoration: none;
        }
        .nav {
            display: flex;
            gap: 32px;
            padding-top: 8px;
        }
        .nav a {
            font-family: 'DM Mono', monospace;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
            text-decoration: none;
            opacity: 0.68;
            transition: opacity 0.2s ease, color 0.2s ease;
        }
        .nav a:hover { opacity: 1; color: var(--blue); }

        /* ── Intro blurb ── */
        /* the blurb column matches one thumbnail: same left edge as the grid,
           and exactly one grid column wide (two columns minus the 40px gutter) */
        .intro { margin-top: 84px; max-width: calc((100% - 40px) / 2); }
        .intro .eyebrow {
            font-family: 'DM Mono', monospace;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .intro .blurb {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: -0.01em;
            text-wrap: pretty;
        }

        /* ── Project grid: responsive, max two per row ── */
        .grid {
            margin-top: 88px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 40px;   /* 40px between thumbnails in the same row */
            row-gap: 32px;      /* next row sits 32px below the subtitle above it */
        }

        .card { display: block; }
        .card-thumb {
            display: block;
            position: relative;
            aspect-ratio: 868 / 488;   /* every thumbnail is the exact same size */
            border-radius: 12px;
            overflow: hidden;
            background: var(--thumb-bg);
            text-decoration: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        .card-thumb.static { pointer-events: none; cursor: default; }
        .card-thumb img,
        .card-thumb video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;   /* fill the uniform frame, no letterboxing */
        }
        /* metacode terminal: scaled down slightly against a backdrop that
           recreates the video's own background — same near-black base, same
           blurred purple orb, same position — so the video reads as sitting
           on one continuous canvas rather than a pasted-in clip */
        .card-thumb.inset { background: #060409; }
        .card-thumb.inset::before {
            content: '';
            position: absolute;
            top: -18%;
            left: 30%;
            width: 52%;
            height: 68%;
            background: #1F0847;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
        }
        .card-thumb.inset video {
            position: relative;
            z-index: 1;
            width: 86%;
            height: 86%;
            margin: 7%;
            object-fit: contain;
        }

        .card-title {
            font-family: 'ZT Bros Oskon 90s', serif;
            font-weight: 300;
            font-size: 32px;
            line-height: 1.1;
            padding-left: 4px;
            margin-top: 16px;   /* title sits 16px below the thumbnail */
        }
        .card-sub {
            font-size: 16px;
            line-height: 1.4;
            color: var(--muted);
            padding-left: 4px;
            margin-top: 4px;    /* 4px between title and subtitle */
        }
        .card-sub .yr { color: var(--blue); }

        /* ── TV static placeholder (for projects without a thumbnail yet) ── */
        .tv {
            position: absolute;
            inset: 0;
            background: #000;
        }
        .tv .bars {
            position: absolute;
            inset: 0 0 25% 0;
            background: linear-gradient(to right,
                #BEBEBE 0% 14.285%, #BEBE00 14.285% 28.57%, #00BEBE 28.57% 42.855%,
                #00BE00 42.855% 57.14%, #BE00BE 57.14% 71.425%, #BE0000 71.425% 85.71%,
                #0000BE 85.71% 100%);
        }
        .tv .bottom {
            position: absolute;
            inset: 75% 0 0 0;
            background: linear-gradient(to right,
                #1D0061 0% 14.285%, #ffffff 14.285% 28.57%, #32006A 28.57% 42.855%,
                #000000 42.855% 57.14%, #090909 57.14% 71.425%, #000000 71.425% 85.71%,
                #1c1c1c 85.71% 100%);
        }
        .tv .scan {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(to bottom,
                rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.16) 3px, rgba(0,0,0,0) 4px);
            mix-blend-mode: multiply;
        }

        @media (max-width: 720px) {
            .page { padding: 36px 24px 80px; }
            .brand { font-size: 28px; }
            .nav { gap: 18px; }
            .intro { margin-top: 56px; max-width: none; }   /* full width once the grid is single-column */
            .intro .blurb { font-size: 26px; }
            .grid {
                margin-top: 56px;
                grid-template-columns: 1fr;   /* single column on small screens */
                row-gap: 32px;
            }
            .card-title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="site-header">
            <a class="brand" href="./">Jay Li Quek</a>
            <nav class="nav">
                <a href="./">Home</a>
                <a href="./resume.html">Resume</a>
                <a href="https://www.linkedin.com/in/jayliquek/" target="_blank" rel="noopener">LinkedIn</a>
            </nav>
        </header>

        <section class="intro">
            <p class="eyebrow">Based in New York, NY</p>
            <p class="blurb">Currently designing AI tools for work. I work across product strategy and craft. I'm drawn to the systems layer—building scalable frameworks, setting direction across teams, and doing my best work in spaces that are still taking shape.</p>
        </section>

        <main class="grid" id="grid"></main>
    </div>

    <script>
    // Project order matches the layout top-to-bottom, left-to-right.
    // `thumb` is null when no artwork exists yet — the TV static placeholder
    // stands in until a real thumbnail is dropped in.
    // `slug` drives the case-study link; the detail pages are built on a
    // separate branch, so this layout only points at ./projects/<slug>.html.
    const PROJECTS = [
        { slug: 'vibe-coding-terminal', title: 'Vibe coding the terminal UI',                     year: 'Current', sub: 'Building an internal terminal for 70K engineers at Meta',        thumb: { type: 'video', src: './videos/vibe-coding-terminal.mp4' }, clickable: true, playable: true, inset: true },
        { slug: 'vibes-growth-flywheel', title: 'Kickstarting the growth flywheel on Vibes',       year: '2026',    sub: 'Building the sharing & growth infrastructure for a suite of new features', thumb: { type: 'video', src: './videos/vibes-growth-flywheel.mp4' }, clickable: true, playable: true },
        { slug: 'meta-ai-sharing',       title: 'Evolution of sharing on Meta AI',                  year: '2025',    sub: 'AI for utility: Shaping artifact sharing and the considerations that follow', thumb: null, clickable: true },
        { slug: 'facebook-share-sheet',  title: 'Sparking conversation through sharing experiences', year: '2025',   sub: 'Share sheet on Facebook',                                        thumb: { type: 'image', src: './images/share-sheet-facebook.png' }, clickable: false },
        { slug: 'messenger-growth',      title: 'Driving 2.5M friend accepts on Messenger',         year: '2024',    sub: 'Messenger growth',                                               thumb: { type: 'image', src: './images/messenger-growth.png' }, clickable: false },
        { slug: 'messenger-notes',       title: 'Expressing mood with music notes',                 year: '2023',    sub: 'Messenger notes',                                                thumb: { type: 'video', src: './videos/music-notes.mp4' }, playable: true },
    ];

    function buildThumb(p) {
        if (!p.thumb) return '<div class="tv"><div class="bars"></div><div class="bottom"></div><div class="scan"></div></div>';
        if (p.thumb.type === 'video') {
            return `<video src="${p.thumb.src}" muted loop playsinline preload="metadata"></video>`;
        }
        return `<img src="${p.thumb.src}" alt="${p.title}" loading="lazy">`;
    }

    document.getElementById('grid').innerHTML = PROJECTS.map((p, i) => {
        const thumbClasses = ['card-thumb'];
        if (p.playable) thumbClasses.push('playable');
        if (!p.clickable && !p.playable) thumbClasses.push('static');
        if (p.inset) thumbClasses.push('inset');

        const thumbHTML = buildThumb(p);
        const thumbElement = p.clickable
            ? `<a class="${thumbClasses.join(' ')}" href="./projects/${p.slug}.html">${thumbHTML}</a>`
            : `<div class="${thumbClasses.join(' ')}">${thumbHTML}</div>`;

        return `
        <article class="card" data-index="${i}">
            ${thumbElement}
            <h2 class="card-title">${p.title}</h2>
            <p class="card-sub"><span class="yr">${p.year}</span> · ${p.sub}</p>
        </article>`;
    }).join('');

    // Video playback for the playable card: plays only while scrolled into view
    const playObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            const video = entry.target.querySelector('video');
            if (!video) return;
            if (entry.isIntersecting) {
                video.play().catch(() => {});
            } else {
                video.pause();
                video.currentTime = 3;   /* rest frozen at 3 seconds when out of view */
            }
        });
    }, { threshold: 0.5 });

    document.querySelectorAll('.card-thumb.playable').forEach((thumb) => {
        const video = thumb.querySelector('video');
        if (!video) return;
        video.currentTime = 3;   /* start frozen at 3 seconds */
        playObserver.observe(thumb);
    });
    </script>
</body>
</html>
